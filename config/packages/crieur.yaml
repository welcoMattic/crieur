# Crieur: voice engines, voices and pipeline settings.
parameters:
    crieur.voice_engine: '%env(CRIEUR_VOICE_ENGINE)%'
    crieur.editor: '%env(CRIEUR_EDITOR)%'
    crieur.allow_private_networks: '%env(bool:CRIEUR_ALLOW_PRIVATE_NETWORKS)%'
    # The article extractor: Defuddle compiled into one binary by tools/defuddle/build.sh.
    crieur.defuddle: '%env(resolve:CRIEUR_DEFUDDLE)%'
    crieur.audio_dir: '%env(resolve:CRIEUR_AUDIO_DIR)%'
    # How long the voice waits for the speech editor before reading the text of the rules.
    crieur.editor_wait_seconds: 2.5
    # The public demo (APP_ENV=demo): its limits, and whether it is one.
    crieur.public_demo: false
    crieur.demo.visitor_articles: 5
    crieur.demo.all_articles: 30
    crieur.demo.max_characters: 25000

    # Each engine maps a language and a gender to a voice: "id" is what the engine expects,
    # "name" what the listener sees. Changing a voice needs no code change.
    crieur.voice_engines:
        phonon:
            label: 'Phonon by Gradium, a local voice (Ollama, or the Phonon servers of CRIEUR_PHONON_SERVERS)'
            model: '%env(CRIEUR_PHONON_MODEL)%'
            license: 'CC BY-NC 4.0'
            local: true
            voices:
                fr: { female: { id: Tiphaine, name: Tiphaine }, male: { id: Lucien, name: Lucien } }
                en: { female: { id: Hadley, name: Hadley }, male: { id: Preston, name: Preston } }
        voxtral:
            label: 'Voxtral TTS by Mistral AI, in the cloud'
            model: 'voxtral-mini-tts-3-0'
            license: 'Mistral AI terms of use'
            local: false
            voices:
                fr: { female: { id: voice_592, name: Marie }, male: { id: voice_592, name: Marie } }
                en: { female: { id: voice_478, name: Sheila }, male: { id: voice_485, name: Rob } }

when@test:
    parameters:
        crieur.audio_dir: '%kernel.project_dir%/var/audio_test'
        crieur.editor_wait_seconds: 0

when@demo:
    parameters:
        crieur.public_demo: true
