framework:
    default_locale: en
    # The interface speaks English and French: the switch in the header keeps the choice in a
    # cookie, else the Accept-Language header of the browser decides.
    enabled_locales: [en, fr]
    set_locale_from_accept_language: true
    set_content_language_from_locale: true
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: [en]
        providers:
