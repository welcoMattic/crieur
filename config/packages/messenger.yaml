framework:
    messenger:
        failure_transport: failed

        transports:
            # Extraction is quick: its own queue, so a long synthesis never delays a new article.
            extract:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: extract
                    # A worker stopped in the middle of a message hands it over after 5 minutes.
                    redeliver_timeout: 300
                retry_strategy:
                    max_retries: 0
            synthesize:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: synthesize
                    # Runs are sliced (SynthesizeArticleHandler::SLICE_SECONDS, 5 seconds): 5 minutes is plenty.
                    redeliver_timeout: 300
                retry_strategy:
                    max_retries: 2
                    delay: 2000
            # The speech editor works ahead of the voice, in its own worker.
            edit:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: edit
                    redeliver_timeout: 300
                retry_strategy:
                    max_retries: 1
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Message\ExtractArticle: extract
            App\Message\SynthesizeArticle: synthesize
            App\Message\EditArticle: edit

when@test:
    framework:
        messenger:
            transports:
                extract: 'in-memory://'
                synthesize: 'in-memory://'
                edit: 'in-memory://'
