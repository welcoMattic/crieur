framework:
    messenger:
        failure_transport: failed

        transports:
            # Extraction is quick: its own queue, so a long synthesis never delays a new article.
            extract:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: extract
                retry_strategy:
                    max_retries: 0
            synthesize:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: synthesize
                retry_strategy:
                    max_retries: 2
                    delay: 2000
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Message\ExtractArticle: extract
            App\Message\SynthesizeArticle: synthesize

when@test:
    framework:
        messenger:
            transports:
                extract: 'in-memory://'
                synthesize: 'in-memory://'
