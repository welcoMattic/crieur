parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # The speech platform of Crieur: one Symfony AI platform, the text-to-speech of two of its bridges.
    # The model name picks the provider (CatalogBasedModelRouter): "phonon:*" runs on Ollama (or on
    # the Phonon servers of CRIEUR_PHONON_SERVERS, one per language), "voxtral-*" on Mistral AI.
    crieur.platform.speech.ollama:
        class: Symfony\AI\Platform\ProviderInterface
        factory: ['App\Speech\Phonon\PhononProvider', 'create']
        arguments: ['%env(OLLAMA_HOST_URL)%', '@http_client', '@event_dispatcher', '%env(CRIEUR_PHONON_SERVERS)%']

    crieur.platform.speech.mistral:
        class: Symfony\AI\Platform\ProviderInterface
        factory: ['Symfony\AI\Platform\Bridge\Mistral\Factory', 'createProvider']
        arguments:
            $apiKey: '%env(MISTRAL_API_KEY)%'
            $httpClient: '@http_client'
            $eventDispatcher: '@event_dispatcher'
            $name: 'mistral-speech'

    crieur.platform.speech:
        class: Symfony\AI\Platform\Platform
        arguments:
            - ['@crieur.platform.speech.ollama', '@crieur.platform.speech.mistral']
            - '@Symfony\AI\Platform\ModelRouter\CatalogBasedModelRouter'
            - '@event_dispatcher'

    Symfony\AI\Platform\ModelRouter\CatalogBasedModelRouter: ~

when@test:
    services:
        crieur.platform.speech:
            class: Symfony\AI\Platform\Platform
            factory: ['App\Tests\Fake\FakeSpeechPlatform', 'create']
