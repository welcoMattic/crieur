settings:
    title: "Settings"
    lede: "The voice and the speech editor in use, and the ways to send articles to Crieur."
    toc: "On this page"
    voice:
        title: "Voice and speech editor"
        lede: "Crieur reads with Phonon on this computer, through Ollama, or with Voxtral by Mistral AI in the cloud. First, a speech editor (a language model) can rewrite the text for the ear: numbers, units, abbreviations, symbols."
    engines:
        title: "Choose"
        voice: "Voice"
        editor: "Speech editor"
        editor_choice:
            auto: "Auto"
            mistral: "Mistral"
            ollama: "Ollama"
            "off": "Rules only"
        note: "Applies at once to the next articles and to voice changes, without restarting anything. Ready articles keep their voice. Auto uses Mistral when a key is set, else the rules. Without a choice here, CRIEUR_VOICE_ENGINE and CRIEUR_EDITOR decide."
        needs_key: "Voxtral and the Mistral editor need MISTRAL_API_KEY in .env.local, then a restart of the server and its workers."
        saved: "Saved: the next articles use this choice."
    editor:
        name: "Speech editor"
        model: "Model by %provider%:"
        rules: "Rules only, no language model"
        setting: "Setting:"
    ollama:
        reachable: "Reachable at %url%"
        unreachable: "Not reachable at %url%"
    mistral:
        key: "Mistral API key"
        set: "Set (never shown)"
        unset: "Not set: the cloud voice and editor are off"
    mcp:
        title: "AI assistants (MCP)"
        lede: "Crieur is an MCP server: an assistant such as Claude can send it an article to read aloud, list the library or read a transcript."
        desktop: "Claude Desktop starts Crieur itself (stdio transport). Add this to claude_desktop_config.json:"
        tools: "Tools"
        read_aloud: "adds a web article to the library and reads it aloud"
        list_library: "lists the latest articles with their status"
        get_article: "gives the details and the transcript of an article"
        example: "Then ask, for instance: “Read this article to me with Crieur: https://…”"
    bookmarklet:
        title: "Bookmarklet"
        lede: "On any article, one click sends the page to Crieur, which opens it and starts reading."
        button: "Read with Crieur"
        drag: "Drag this button to your bookmarks bar."
        drag_hint: "Drag the button to your bookmarks bar: here, it has nothing to read."
        manual: "Or create a bookmark with this address:"
    podcast:
        title: "Private podcast"
        lede: "Every ready article becomes an episode. Subscribe with this address in a podcast app that can reach this computer."
        private: "This address is the key: anyone who has it can listen to your library. Changing APP_SECRET revokes it."

